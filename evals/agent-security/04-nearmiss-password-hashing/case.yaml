schema_version: '1.0'
name: 04-nearmiss-password-hashing
tags:
- agent-security
- near-miss
runs: 3
execution:
  prompt: |
    Which password hashing algorithm should my web app use for user logins? One paragraph.
  max_turns: 6
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: agent-security
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply recommends a modern password hash such as Argon2id, scrypt or bcrypt, in about one paragraph.
  weight: 1
