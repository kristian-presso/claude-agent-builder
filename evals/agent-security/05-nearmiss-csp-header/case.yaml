schema_version: '1.0'
name: 05-nearmiss-csp-header
tags:
- agent-security
- near-miss
runs: 3
execution:
  prompt: |
    What does the Content-Security-Policy header do on a website? Short answer.
  max_turns: 6
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: agent-security
  min: 0
  max: 0
