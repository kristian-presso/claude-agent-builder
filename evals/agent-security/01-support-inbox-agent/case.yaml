schema_version: '1.0'
name: 01-support-inbox-agent
tags:
- agent-security
- fire
- design
runs: 3
execution:
  prompt: |
    I want an agent that reads our support inbox, looks customers up in the CRM, and replies to them automatically overnight. Is that safe?
  max_turns: 5
  timeout_seconds: 180
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: agent-security
- type: llm
  name: trifecta-and-leg-removal-1
  criteria: |
    Pass if this is true of the reply: It identifies all three: private data (CRM), untrusted content (inbound email), and a way to send data out (sending replies), and says the combination is exploitable by design (prompt injection can exfiltrate CRM data).
  weight: 0.667
- type: llm
  name: trifecta-and-leg-removal-2
  criteria: |
    Pass if this is true of the reply: Its single top recommendation removes a leg, most naturally: the agent drafts and a person sends (or another structural removal), rather than leading with prompt wording, warnings or filters.
  weight: 0.667
- type: llm
  name: trifecta-and-leg-removal-3
  criteria: |
    Pass if this is true of the reply: It does not call the result "secure" or say injection is "prevented"; it states residual risk.
  weight: 0.667
