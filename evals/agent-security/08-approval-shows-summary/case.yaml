schema_version: '1.0'
name: 08-approval-shows-summary
tags:
- agent-security
- fire
- design
- hard
runs: 3
execution:
  prompt: |
    Our accounts-payable agent reads supplier invoices that arrive in the AP inbox (PDFs and emails) and pays them through our bank's API. To be safe, every payment needs a human: the agent calls request_approval(summary) which posts its summary to Slack with an Approve button, and once someone approves, the agent calls pay(payee_iban, amount, reference). With a human approving every payment, prompt injection can't really hurt us, can it?
  max_turns: 5
  timeout_seconds: 180
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: agent-security
- type: llm
  name: approver-sees-model-text
  criteria: |
    Pass if the reply points out that the approver sees a summary written by the agent, which an injected invoice can make misleading, so the approval must show the actual payment parameters (payee, IBAN, amount) rendered by the system from the call itself, not by the model.
  weight: 1
- type: llm
  name: approval-bound-to-call
  criteria: |
    Pass if the reply points out that approval and payment are separate, unlinked calls, so the agent can be approved for one payment and then call pay with different arguments; the approval must be bound to the exact parameters (for example the system holds the pending payment and executes exactly what was approved).
  weight: 1
- type: llm
  name: changed-bank-details
  criteria: |
    Pass if the reply names the invoice-redirection pattern (an invoice or email saying the supplier's bank details have changed) and requires that a payee IBAN be checked against the supplier record held outside the inbox, with new or changed bank details verified out of band, so the agent cannot introduce a payee from email content.
  weight: 1
- type: llm
  name: approval-fatigue
  criteria: |
    Pass if the reply warns that approving every payment trains people to click Approve without reading (approval fatigue), and suggests concentrating human attention where it matters, for example new or changed payees and amounts over a threshold, with routine payments to known payees handled by deterministic rules.
  weight: 1
