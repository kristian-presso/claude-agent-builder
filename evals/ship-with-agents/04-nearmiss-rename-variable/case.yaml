schema_version: '1.0'
name: 04-nearmiss-rename-variable
tags:
- ship-with-agents
- near-miss
runs: 3
execution:
  prompt: |
    Rename the variable `tmp` to `total` in this snippet: `tmp = a + b\nprint(tmp)`
  max_turns: 6
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: ship-with-agents
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply shows the snippet with tmp renamed to total in both places.
  weight: 1
