schema_version: '1.0'
name: 03-vague-workflow
tags:
- ship-with-agents
- fire
- vague
runs: 3
execution:
  prompt: |
    How do I know the agent actually finished? It keeps telling me things are done when they're not.
  max_turns: 4
  timeout_seconds: 150
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: ship-with-agents
- type: llm
  name: structural-answer-1
  criteria: |
    Pass if this is true of the reply: It recommends writing acceptance criteria before the work that a wrong build could not pass.
  weight: 0.5
- type: llm
  name: structural-answer-2
  criteria: |
    Pass if this is true of the reply: It recommends that a separate agent, not the builder, verifies the work using only the criteria and the diff.
  weight: 0.5
- type: llm
  name: structural-answer-3
  criteria: |
    Pass if this is true of the reply: It says each check is reported as pass, fail or unmeasured, with unmeasured treated as not done.
  weight: 0.5
- type: llm
  name: structural-answer-4
  criteria: |
    Pass if this is true of the reply: It says a blocked step must declare that it is blocked, or that state should live in files on disk rather than in the chat.
  weight: 0.5
