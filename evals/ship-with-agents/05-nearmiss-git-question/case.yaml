schema_version: '1.0'
name: 05-nearmiss-git-question
tags:
- ship-with-agents
- near-miss
runs: 3
execution:
  prompt: |
    What's the git command to undo my last local commit but keep the changes?
  max_turns: 6
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: ship-with-agents
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply gives git reset --soft HEAD~1 (or an equivalent that keeps changes).
  weight: 1
