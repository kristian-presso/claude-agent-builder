schema_version: '1.0'
name: 05-nearmiss-mcp-tool-text
tags:
- mcp-app-builder
- near-miss
runs: 3
execution:
  prompt: |
    Add a get_weather tool to my Python MCP server that returns the temperature as text. Just the function, no UI.
  max_turns: 4
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: mcp-app-builder
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply gives a Python MCP tool function for weather that returns text.
  weight: 1
