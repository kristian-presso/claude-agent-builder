schema_version: '1.0'
name: 04-nearmiss-react-dashboard
tags:
- mcp-app-builder
- near-miss
runs: 3
execution:
  prompt: |
    Write a small React component that shows a table of orders with a search box. Standalone web app, nothing to do with MCP.
  max_turns: 3
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: mcp-app-builder
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply gives a React component with a search input that filters an orders table.
  weight: 1
