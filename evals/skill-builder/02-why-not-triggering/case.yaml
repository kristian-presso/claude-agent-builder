schema_version: '1.0'
name: 02-why-not-triggering
tags:
- skill-builder
- fire
- debug
runs: 3
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    My skill in skills/invoice-helper/ never triggers. Why?
  max_turns: 8
  timeout_seconds: 240
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Edit
  - Write
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: skill-builder
- type: llm
  name: diagnoses-description-1
  criteria: |
    Pass if the reply identifies this problem (in its own words is fine): The name "My Helper" is invalid (must be lowercase letters, digits and hyphens) and does not match the folder name invoice-helper.
  weight: 0.5
- type: llm
  name: diagnoses-description-2
  criteria: |
    Pass if the reply identifies this problem (in its own words is fine): The description is first person ("I can") rather than third person.
  weight: 0.5
- type: llm
  name: diagnoses-description-3
  criteria: |
    Pass if the reply identifies this problem (in its own words is fine): The description has no "Use when ..." and no concrete trigger phrases a user would actually type.
  weight: 0.5
- type: llm
  name: diagnoses-description-4
  criteria: |
    Pass if the reply identifies this problem (in its own words is fine): The description is too vague ("invoices and stuff") to match requests; the reply either proposes a concrete rewritten description or asks what the skill should do so it can write one (it must not leave the fix unaddressed).
  weight: 0.5
