schema_version: '1.0'
name: 01-make-this-a-skill
tags:
- skill-builder
- fire
- build
runs: 3
execution:
  prompt: |
    Every Monday I pull last week's sales CSV, compare it to the week before, and write three bullets for the team, flagging anything that moved more than 10%. Make that a skill for Claude Code. Save it in skills/ in this project (it ships in our plugin).
  max_turns: 20
  timeout_seconds: 480
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Edit
  - Write
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: skill-builder
- type: file_exists
  name: skill-file-written
  path: skills/*/SKILL.md
  weight: 0.5
- type: llm
  name: description-and-evals
  criteria: |
    Judge the whole run (trace). Pass only if at least FOUR of these FIVE hold:
    1. The SKILL.md frontmatter has a name in lowercase-hyphen form matching its folder, and a third-person description that says what it does and "Use when ..." with concrete trigger phrases such as "weekly sales summary".
    2. The week-on-week comparison is a deterministic script (scripts/...) or explicitly called out as the exact step, rather than left to free-form judgement.
    3. Test prompts are written: at least two that should trigger (one plain, one vague) and one near miss that should not.
    4. The body is lean (well under 500 lines) and has a short Configuration section for what varies.
    5. No real names, credentials or internal URLs are in the files.
  weight: 2
  focus: trace
