schema_version: '1.0'
name: 04-nearmiss-what-is-mcp
tags:
- mcp-server-builder
- near-miss
runs: 3
execution:
  prompt: |
    In two sentences, what is the Model Context Protocol?
  max_turns: 6
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: mcp-server-builder
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply explains MCP as an open protocol for connecting AI applications to tools and data, in about two sentences.
  weight: 1
