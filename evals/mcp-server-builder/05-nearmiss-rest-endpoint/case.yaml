schema_version: '1.0'
name: 05-nearmiss-rest-endpoint
tags:
- mcp-server-builder
- near-miss
runs: 3
execution:
  prompt: |
    Write a FastAPI endpoint GET /health that returns {"ok": true}.
  max_turns: 6
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: mcp-server-builder
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply gives a FastAPI route for GET /health returning {"ok": true}.
  weight: 1
