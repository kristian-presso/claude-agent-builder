schema_version: '1.0'
name: 03-421-behind-proxy
tags:
- mcp-server-builder
- fire
- debug
runs: 3
execution:
  prompt: |
    My Python MCP server works fine locally but behind my reverse proxy every request comes back 421. Why?
  max_turns: 5
  timeout_seconds: 180
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: mcp-server-builder
- type: llm
  name: host-allowlist
  criteria: |
    Pass only if ALL hold:
    1. It identifies the transport security / DNS rebinding protection Host allowlist as the cause: the proxy forwards the public Host header, which is not in allowed_hosts (or protection is on with an empty allowed_hosts).
    2. The fix is to list the public hostname the proxy forwards in allowed_hosts (not to disable protection as the recommended fix).
  weight: 2
