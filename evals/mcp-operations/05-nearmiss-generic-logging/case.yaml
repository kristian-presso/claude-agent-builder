schema_version: '1.0'
name: 05-nearmiss-generic-logging
tags:
- mcp-operations
- near-miss
runs: 3
execution:
  prompt: |
    How do I add structured JSON logging to a FastAPI app so each request logs its path, status code and duration?
  max_turns: 12
  timeout_seconds: 360
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: mcp-operations
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if this is true of the reply: It shows a working way to log path, status code and duration per request in FastAPI (for example middleware) as structured JSON.
  weight: 1
