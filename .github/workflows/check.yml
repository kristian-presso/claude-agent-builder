name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every skill
        run: |
          for d in skills/*/; do
            python3 -I skills/skill-builder/scripts/validate_skill.py "$d"
          done
      - name: JSON files parse
        run: |
          python3 -I -c "import json,subprocess; fs=subprocess.run(['git','ls-files','*.json'],capture_output=True,text=True,check=True).stdout.split(); [json.load(open(f)) for f in fs]; print(len(fs),'JSON files ok')"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plugin and marketplace manifests
        run: |
          npx -y @anthropic-ai/claude-code@2.1.301 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.301 plugin validate .claude-plugin/plugin.json
      - name: Script unit tests (the mcp-operations SQL runs against the Postgres service)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: python3 -I -m unittest discover -s tests -v
